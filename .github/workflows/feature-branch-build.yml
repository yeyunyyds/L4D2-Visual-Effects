name: Feature branch build verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native regression tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: bash scripts/test.sh
  windows-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686-posix
      - name: Compile L4D2Visual Windows x86 DLL
        env:
          CXX_X86: i686-w64-mingw32-g++-posix
        run: bash scripts/build-mingw.sh
      - name: Upload experimental DLL
        uses: actions/upload-artifact@v4
        with:
          name: L4D2Visual-special-glow-win32
          path: build/L4D2Visual.dll
          if-no-files-found: error
