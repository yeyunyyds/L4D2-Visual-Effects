name: FPB mean calibration preview (no release)
on:
  push:
    branches: [experimental/fpb-mean-calibration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mingw-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686-posix
      - name: Regression
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: bash scripts/test.sh
      - name: Build
        env:
          CXX_X86: i686-w64-mingw32-g++-posix
        run: bash scripts/build-mingw.sh
      - name: Package
        run: |
          python3 scripts/package.py
          mv build/L4D2Visual-1.1.0.zip build/L4D2Visual-FPB-Mean-1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2Visual-FPB-Mean-1
          path: |
            build/L4D2Visual-FPB-Mean-1.zip
            docs/FPB-MEAN-CALIBRATION.md
          if-no-files-found: error
