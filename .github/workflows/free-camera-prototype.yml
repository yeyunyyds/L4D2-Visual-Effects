name: FreeCamera Windows x86 experiment
on:
  push:
    branches: [experimental/free-camera-73c6dc8a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686-posix
      - name: Free camera math smoke test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/free_camera_core_test.cpp -o /tmp/freecam_test
          /tmp/freecam_test
      - name: Windows x86 DLL
        env:
          CXX_X86: i686-w64-mingw32-g++-posix
        run: bash scripts/build-mingw.sh
      - name: Existing tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: bash scripts/test.sh
      - run: python3 scripts/package.py
      # GitHub Artifacts are themselves downloaded as ZIP archives. Uploading
      # an installer ZIP would create ZIP-inside-ZIP. Stage the installer files
      # instead so the downloaded artifact is the only archive layer.
      - name: Stage single-layer installation artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("build/L4D2Visual-0.8.0.zip")
          stage = Path("build/free-camera-artifact")
          expected = {
              "README.md",
              "bin/neko/plugins/L4D2Visual.dll",
              "bin/neko/plugins/L4D2Visual/hud.json",
          }
          with ZipFile(archive) as package:
              assert package.testzip() is None
              assert set(package.namelist()) == expected
              package.extractall(stage)

          actual = {
              item.relative_to(stage).as_posix()
              for item in stage.rglob("*")
              if item.is_file()
          }
          assert actual == expected, f"Unexpected install entries: {actual ^ expected}"
          assert not any(stage.rglob("*.zip")), "Nested archive in artifact"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2Visual-FreeCamera-x86
          path: build/free-camera-artifact/
          if-no-files-found: error
