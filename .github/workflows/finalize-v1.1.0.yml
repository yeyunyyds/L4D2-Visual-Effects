name: Finalize verified L4D2Visual v1.1.0
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: finalize-l4d2visual-v1.1.0
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE_SHA: 4a3ef02076680da3cd2521176dfbaa6390aed01f
  RELEASE_TAG: v1.1.0
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish verified L4D2Visual v1.1.0 artifacts')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a3ef02076680da3cd2521176dfbaa6390aed01f
          fetch-depth: 0
      - name: Verify source and prior successful build jobs
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          gh api "repos/$GH_REPO/actions/runs/45504706776" > /tmp/run.json
          gh api "repos/$GH_REPO/actions/runs/45504706776/jobs" > /tmp/jobs.json
          python3 - <<'PY'
          import os,json
          run=json.load(open('/tmp/run.json'))
          assert run['head_sha']==os.environ['SOURCE_SHA'] and run['head_branch']=='main'
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          for name in ('mingw-x86','msvc-x86'):
              assert any(j['name']==name and j['conclusion']=='success' for j in jobs), name
          PY
      - name: Download the exact previously verified artifacts
        run: |
          gh run download 45504706776 --repo "$GH_REPO" -n L4D2Visual-1.1.0-release-assets --dir release-assets
          (cd release-assets && sha256sum -c *.sha256)
      - name: Verify installer, source ZIP and commit provenance
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os,struct,json
          p=Path('release-assets')
          assert {x.name for x in p.iterdir()}=={'L4D2Visual-1.1.0.zip','L4D2Visual-1.1.0.zip.sha256','L4D2Visual-1.1.0-source.zip','L4D2Visual-1.1.0-source.zip.sha256'}
          source=os.environ['SOURCE_SHA']
          with ZipFile(p/'L4D2Visual-1.1.0.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'README.md','bin/neko/plugins/L4D2Visual.dll','bin/neko/plugins/L4D2Visual/hud.json'}
              dll=z.read('bin/neko/plugins/L4D2Visual.dll')
              pe=struct.unpack_from('<I',dll,0x3c)[0]
              assert dll[pe:pe+4]==b'PE\x00\x00' and struct.unpack_from('<H',dll,pe+4)[0]==0x14c
              assert b'L4D2Visual 1.1.0' in dll
              assert 'Source commit: '+source in z.read('README.md').decode()
              cfg=json.loads(z.read('bin/neko/plugins/L4D2Visual/hud.json'))
              assert cfg['freeCamera']['externalEnabled'] is False
          with ZipFile(p/'L4D2Visual-1.1.0-source.zip') as z:
              assert z.testzip() is None and z.comment.decode()==source
              assert z.read('docs/releases/v1.1.0.md')==Path('docs/releases/v1.1.0.md').read_bytes()
          PY
      - name: Create or resume draft targeting the verified source
        run: |
          if tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$SOURCE_SHA"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/release.json 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          assert r['isDraft'], 'Already published; refusing to overwrite'
          assert r['targetCommitish']==os.environ['SOURCE_SHA'], 'Draft target differs'
          PY
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --title 'L4D2Visual v1.1.0' --notes-file docs/releases/v1.1.0.md
          fi
      - name: Upload four verified assets and publish
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/actual
          (cd release-assets && printf '%s\n' * | sort) > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,url
