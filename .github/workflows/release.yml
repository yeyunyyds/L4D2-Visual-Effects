name: Build and publish release
on:
  push:
    tags: ['v0.8.0']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.8.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8.0
          persist-credentials: false
      - name: Install x86 build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686-posix
      - name: Run regression tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: bash scripts/test.sh
      - name: Build Windows x86 DLL
        env:
          CXX_X86: i686-w64-mingw32-g++-posix
        run: bash scripts/build-mingw.sh
      - name: Package installer and matching source
        run: |
          python3 scripts/package.py
          git archive --format=zip --output=build/L4D2Visual-0.8.0-source.zip HEAD
          cd build
          sha256sum L4D2Visual-0.8.0.zip > L4D2Visual-0.8.0.zip.sha256
          sha256sum L4D2Visual-0.8.0-source.zip > L4D2Visual-0.8.0-source.zip.sha256
      - name: Verify release assets
        run: |
          cd build
          sha256sum -c L4D2Visual-0.8.0.zip.sha256
          sha256sum -c L4D2Visual-0.8.0-source.zip.sha256
          python3 - <<'PY'
          import json, subprocess, zipfile
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with zipfile.ZipFile('L4D2Visual-0.8.0.zip') as z:
              assert z.testzip() is None
              assert {p.split('/')[0] for p in z.namelist()} == {'bin', 'README.md'}
              dll = z.read('bin/neko/plugins/L4D2Visual.dll')
              assert b'L4D2Visual 0.8.0' in dll
              assert b'0.8.0-main-test1' not in dll
              pe = int.from_bytes(dll[0x3c:0x40], 'little')
              assert dll[pe:pe+4] == b'PE\x00\x00'
              assert int.from_bytes(dll[pe+4:pe+6], 'little') == 0x14c
              readme = z.read('README.md').decode()
              assert '联机功能未经测试，不保障 VAC 安全' in readme
              assert revision in readme
              config = json.loads(z.read('bin/neko/plugins/L4D2Visual/hud.json'))
              for key in ['entityTransform', 'tankPrediction', 'tankRockPrediction', 'wallPictures', 'sprayP2P']:
                  assert config[key]['enabled'] is False
              assert config['sprayP2P']['automatic'] is False
              assert config['tankPrediction']['warnRange'] is True
              for key in ['warnBar', 'warnFill', 'warnOutline']:
                  assert config['tankPrediction'][key] is False
          with zipfile.ZipFile('L4D2Visual-0.8.0-source.zip') as z:
              assert z.testzip() is None
              assert z.comment.decode() == revision
              assert 'src/rock_runtime.hpp' in z.namelist()
              assert 'src/aim_runtime.hpp' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2Visual-0.8.0-release-files
          path: |
            build/L4D2Visual-0.8.0*.zip
            build/L4D2Visual-0.8.0*.sha256
          if-no-files-found: error
      - uses: actions/checkout@v4
        with:
          ref: zip
          path: downloads
          persist-credentials: true
      - name: Update download branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source, target = Path('build'), Path('downloads')
          for name in ['L4D2Visual-0.8.0.zip', 'L4D2Visual-0.8.0.zip.sha256', 'L4D2Visual-0.8.0-source.zip', 'L4D2Visual-0.8.0-source.zip.sha256']:
              shutil.copy2(source / name, target / name)
          readme = target / 'README.md'
          text = readme.read_text()
          text = text.replace('当前正式版：[0.7.4]', '当前正式版：[0.8.0]').replace('releases/tag/v0.7.4', 'releases/tag/v0.8.0')
          paragraph = '正式版：[0.8.0 安装包](L4D2Visual-0.8.0.zip) · [配套完整源码](L4D2Visual-0.8.0-source.zip) · [安装包校验](L4D2Visual-0.8.0.zip.sha256)。基于用户验收通过的整合版，由 GitHub CI 构建与发布。所有功能总开关默认关闭；新配置范围红线提醒默认开，其余提醒默认关。请完全退出游戏并备份 DLL、hud.json 后更新。\n\n'
          if '[0.8.0 安装包]' not in text:
              text = text.replace('# L4D2 Visual Effects 下载\n\n', '# L4D2 Visual Effects 下载\n\n' + paragraph, 1)
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('主线整合测试：'):
                  lines[index] = '已验收测试留档：[0.8.0-main-test1](L4D2Visual-0.8.0-main-test1.zip) · [对应源码](L4D2Visual-0.8.0-main-test1-source.zip)。正式版本请使用上方0.8.0下载。'
          readme.write_text('\n'.join(lines) + '\n')
          PY
          cd downloads
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md L4D2Visual-0.8.0.zip L4D2Visual-0.8.0.zip.sha256 L4D2Visual-0.8.0-source.zip L4D2Visual-0.8.0-source.zip.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Publish CI-built L4D2Visual 0.8.0 assets'
            git pull --rebase origin zip
            git push origin HEAD:zip
          fi
      - name: Publish 0.8.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.8.0 >/dev/null 2>&1; then
            gh release create v0.8.0 --verify-tag --draft --title 'L4D2Visual 0.8.0' --notes-file docs/releases/v0.8.0.md
          fi
          gh release upload v0.8.0 build/L4D2Visual-0.8.0.zip build/L4D2Visual-0.8.0.zip.sha256 build/L4D2Visual-0.8.0-source.zip build/L4D2Visual-0.8.0-source.zip.sha256 --clobber
          gh release edit v0.8.0 --title 'L4D2Visual 0.8.0' --notes-file docs/releases/v0.8.0.md --draft=false --prerelease=false --latest
