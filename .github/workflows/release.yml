name: Publish release
on:
  push:
    tags: ['v0.7.2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.7.2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: zip
          path: downloads
          persist-credentials: false
      - name: Verify installer
        run: |
          cd downloads
          sha256sum -c L4D2Visual-0.7.2.zip.sha256
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('L4D2Visual-0.7.2.zip') as z:
              assert z.testzip() is None
              assert {p.split('/')[0] for p in z.namelist()} == {'bin', 'README.md'}
              assert 'bin/neko/plugins/L4D2Visual.dll' in z.namelist()
              assert '联机功能未经测试，不保障 VAC 安全' in z.read('README.md').decode()
          PY
      - name: Publish 0.7.2 and correct historical release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.7.2 >/dev/null 2>&1; then
            gh release edit v0.7.2 --title 'L4D2Visual 0.7.2' --notes-file docs/releases/v0.7.2.md --draft=false --prerelease=false --latest
          else
            gh release create v0.7.2 --verify-tag --title 'L4D2Visual 0.7.2' --notes-file docs/releases/v0.7.2.md --latest
          fi
          gh release upload v0.7.2 downloads/L4D2Visual-0.7.2.zip downloads/L4D2Visual-0.7.2.zip.sha256 --clobber
          gh release edit v0.4.0 --title 'L4D2Visual 0.4.0（历史版本）' --notes-file docs/releases/v0.4.0-correction.md --latest=false
