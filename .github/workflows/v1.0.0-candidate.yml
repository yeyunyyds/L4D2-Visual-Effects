name: L4D2Visual v1.1.1 build and verified release
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/finalize-v1.1.0.yml'
      - '.github/workflows/v1.0.0-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mingw-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686-posix
      - name: FreeCamera movement smoke test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/free_camera_core_test.cpp -o /tmp/freecam_test
          /tmp/freecam_test
          g++ -std=c++17 -Wall -Wextra -Werror tests/free_camera_hotkey_test.cpp -o /tmp/freecam_hotkey_test
          /tmp/freecam_hotkey_test
      - name: Run all regression tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: bash scripts/test.sh
      - name: Build Windows x86 DLL
        env:
          CXX_X86: i686-w64-mingw32-g++-posix
        run: bash scripts/build-mingw.sh
      - name: Package candidate and verify native version
        run: |
          python3 scripts/package.py
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path("build/L4D2Visual-1.1.1.zip")
          expected={"README.md","bin/neko/plugins/L4D2Visual.dll",
                    "bin/neko/plugins/L4D2Visual/hud.json"}
          with ZipFile(archive) as z:
              assert z.testzip() is None
              assert set(z.namelist())==expected
              dll=z.read("bin/neko/plugins/L4D2Visual.dll")
              offset=struct.unpack_from("<I",dll,0x3c)[0]
              assert dll[offset:offset+4]==b"PE\x00\x00"
              assert struct.unpack_from("<H",dll,offset+4)[0]==0x14c
              assert b"L4D2Visual 1.1.1" in dll
              cfg=json.loads(z.read("bin/neko/plugins/L4D2Visual/hud.json"))
              assert cfg["firstPersonBody"]["enabled"] is False
              assert "dynamicAnchor2" not in cfg["firstPersonBody"]
              assert b"fpb-view.1" not in dll
              assert cfg["tankPrediction"]["enabled"] is False
              assert cfg["tankPrediction"]["occludeHud"] is True
              assert "warnOutline" not in cfg["tankPrediction"]
              assert cfg["freeCamera"]["f6Binding"] is False
              assert "v1.1.1" in z.read("README.md").decode("utf-8")
          stage=Path("build/candidate-install")
          with ZipFile(archive) as z:z.extractall(stage)
          assert {p.relative_to(stage).as_posix() for p in stage.rglob("*") if p.is_file()}==expected
          assert not any(stage.rglob("*.zip")),"No ZIP inside GitHub Artifact"
          PY
      - name: Verify external camera exports
        run: |
          i686-w64-mingw32-objdump -p build/L4D2Visual.dll > build/exports.txt
          for symbol in L4D2VisualCameraGetVersion L4D2VisualCameraSetExternalActive L4D2VisualCameraSetPose L4D2VisualCameraGetPose L4D2VisualCameraSetInitialIdle L4D2VisualCameraSetNativeOnInput L4D2VisualCameraGetStatus; do
            grep -q "$symbol" build/exports.txt
          done
      - name: Prepare release assets
        run: |
          git archive --format=zip --output=build/L4D2Visual-1.1.1-source.zip HEAD
          cd build
          sha256sum L4D2Visual-1.1.1.zip > L4D2Visual-1.1.1.zip.sha256
          sha256sum L4D2Visual-1.1.1-source.zip > L4D2Visual-1.1.1-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2Visual-1.1.1-release-assets
          path: |
            build/L4D2Visual-1.1.1*.zip
            build/L4D2Visual-1.1.1*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2Visual-1.1.1-candidate-MinGW-x86
          path: build/candidate-install/
          if-no-files-found: error
  msvc-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Run native state, menu and module regression tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if not exist build mkdir build
          for %%T in (view_compat log_settings first_person_body_patch first_person_native_gate_policy first_person_body_math first_person_body_parts first_person_dynamic_alignment first_person_view_policy first_person_body_config module_host native_menu free_camera_activation_policy tank_occlusion) do (
            cl /nologo /utf-8 /std:c++17 /EHsc /MT /I src /I vendor /I vendor\dango tests\%%T_test.cpp /Fe:build\%%T_test.exe
            if errorlevel 1 exit /b 1
            build\%%T_test.exe
            if errorlevel 1 exit /b 1
          )
      - name: Build Windows x86 DLL with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cl /nologo /utf-8 /std:c++17 /EHsc /O2 /MT /DNOMINMAX /DWIN32_LEAN_AND_MEAN /LD /I src /I vendor /I vendor\imgui src\plugin.cpp vendor\imgui\imgui.cpp vendor\imgui\imgui_draw.cpp vendor\imgui\imgui_tables.cpp vendor\imgui\imgui_widgets.cpp vendor\imgui\backends\imgui_impl_dx9.cpp /link /OUT:build\L4D2Visual.dll /DEF:src\L4D2Visual.def user32.lib d3d9.lib comctl32.lib gdi32.lib uuid.lib advapi32.lib ole32.lib windowscodecs.lib
          if errorlevel 1 exit /b 1
      - name: Package standalone x86 candidate
        shell: pwsh
        run: |
          python scripts/package.py
          $archive = "build/L4D2Visual-1.1.1.zip"
          if (!(Test-Path $archive)) { throw "Candidate installer missing" }
          Expand-Archive -Path $archive -DestinationPath "build/candidate-install" -Force
          $files = @(Get-ChildItem build/candidate-install -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path build/candidate-install).Path.Length + 1).Replace('\','/') })
          $expected = @("README.md","bin/neko/plugins/L4D2Visual.dll","bin/neko/plugins/L4D2Visual/hud.json")
          if (@(Compare-Object $files $expected).Count -ne 0) { throw "Unexpected artifact contents" }
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2Visual-1.1.1-candidate-MSVC-x86
          path: build/candidate-install/
          if-no-files-found: error

  publish-v1-1-1:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'Release L4D2Visual v1.1.1'
    needs: [mingw-x86, msvc-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-v1.1.1
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.1.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: L4D2Visual-1.1.1-release-assets
          path: release-assets
      - name: Verify release assets and source provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd release-assets && sha256sum -c *.sha256)
          python3 - <<'PY'
          import os, struct, json
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('release-assets')
          assert {x.name for x in p.iterdir()}=={'L4D2Visual-1.1.1.zip','L4D2Visual-1.1.1.zip.sha256','L4D2Visual-1.1.1-source.zip','L4D2Visual-1.1.1-source.zip.sha256'}
          with ZipFile(p/'L4D2Visual-1.1.1.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'README.md','bin/neko/plugins/L4D2Visual.dll','bin/neko/plugins/L4D2Visual/hud.json'}
              dll=z.read('bin/neko/plugins/L4D2Visual.dll')
              pe=struct.unpack_from('<I',dll,0x3c)[0]
              assert dll[pe:pe+4]==b'PE\x00\x00' and struct.unpack_from('<H',dll,pe+4)[0]==0x14c
              assert b'L4D2Visual 1.1.1' in dll and b'fpb-view.1' not in dll
              assert 'Source commit: '+os.environ['GITHUB_SHA'] in z.read('README.md').decode()
              cfg=json.loads(z.read('bin/neko/plugins/L4D2Visual/hud.json'))
              assert not cfg['firstPersonBody']['enabled'] and 'dynamicAnchor2' not in cfg['firstPersonBody']
              assert not cfg['freeCamera']['externalEnabled']
          with ZipFile(p/'L4D2Visual-1.1.1-source.zip') as z:
              assert z.testzip() is None and z.comment.decode()==os.environ['GITHUB_SHA']
              assert z.read('docs/releases/v1.1.1.md')==Path('docs/releases/v1.1.1.md').read_bytes()
          PY
      - name: Create or resume verified draft
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/release.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          assert json.load(open('/tmp/release.json'))['isDraft'], 'Already published; refusing to overwrite'
          PY
          fi
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$tag_sha" ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title 'L4D2Visual v1.1.1' --notes-file docs/releases/v1.1.1.md
          fi
      - name: Upload and publish verified artifacts
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/actual
          (cd release-assets && printf '%s\n' * | sort) > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,url
